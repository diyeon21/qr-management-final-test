version: '3.8'

services:
  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=maintenance_user
      - MYSQL_PASSWORD=maintenance_pass
      - MYSQL_DB=qr_maintenance_db
      - SECRET_KEY=generate_a_random_secret_key_here
      - FLASK_DEBUG=0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: qr_maintenance_db
      MYSQL_USER: maintenance_user
      MYSQL_PASSWORD: maintenance_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  uploads_data:
