# ==============================================================================
# Apache / XAMPP VirtualHost Reverse Proxy Configuration
# ==============================================================================
# In XAMPP:
# 1. Enable proxy modules in httpd.conf:
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
# 2. Include this file or add the directives below to httpd-vhosts.conf.
# ==============================================================================

<VirtualHost *:80>
    ServerName maintenance.local
    # ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Optional: Serve uploads and static directly through Apache for high performance
    # Alias /static "c:/xampp/htdocs/Capstone Project/Capstone Project/static"
    # Alias /uploads "c:/xampp/htdocs/Capstone Project/Capstone Project/uploads"

    # <Directory "c:/xampp/htdocs/Capstone Project/Capstone Project/static">
    #     Require all granted
    # </Directory>

    ErrorLog "logs/qr_maintenance_error.log"
    CustomLog "logs/qr_maintenance_access.log" common
</VirtualHost>
