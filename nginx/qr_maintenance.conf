# ==============================================================================
# Nginx Reverse Proxy Configuration for QR Maintenance Management System
# ==============================================================================

upstream qr_maintenance_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name maintenance.example.com; # Replace with your server IP or domain

    # Optional: Redirect all HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets serving / caching
    location /static/ {
        alias /path/to/Capstone Project/static/; # Update with absolute path to static folder
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploads directory
    location /uploads/ {
        alias /path/to/Capstone Project/uploads/; # Update with absolute path to uploads folder
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy to Flask / Waitress / Gunicorn WSGI
    location / {
        proxy_pass http://qr_maintenance_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
